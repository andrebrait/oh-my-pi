name: zz probe caller
on: workflow_dispatch
permissions: {}
jobs:
   call:
      uses: ./.github/workflows/zz-probe-called.yml
   a-always:
      needs: call
      if: always()
      runs-on: ubuntu-24.04
      timeout-minutes: 2
      steps:
         - env:
              NEEDS: ${{ toJSON(needs) }}
              RESULT: ${{ needs.call.result }}
           run: printf 'result=%s\n%s\n' "$RESULT" "$NEEDS"
   b-always-expr:
      needs: call
      if: ${{ always() && (needs.call.result == 'failure' || needs.call.result == 'cancelled') }}
      runs-on: ubuntu-24.04
      timeout-minutes: 2
      steps:
         - run: echo b ran
   c-not-cancelled:
      needs: call
      if: ${{ !cancelled() }}
      runs-on: ubuntu-24.04
      timeout-minutes: 2
      steps:
         - run: echo c ran
   d-output:
      needs: call
      if: ${{ always() && needs.call.outputs.marker == 'hello' }}
      runs-on: ubuntu-24.04
      timeout-minutes: 2
      steps:
         - run: echo d ran
